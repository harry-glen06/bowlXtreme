name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML
        run: brew install sfml

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Mac zip (${{ matrix.arch }})
        run: |
          mkdir -p release-mac-${{ matrix.arch }}
          cp build/bowling release-mac-${{ matrix.arch }}/bowling
          if [ -d assets ]; then
            cp -r assets release-mac-${{ matrix.arch }}/assets
          fi
          cat > release-mac-${{ matrix.arch }}/Play\ Bowling.command << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          ./bowling
          EOF
          chmod +x release-mac-${{ matrix.arch }}/Play\ Bowling.command
          chmod +x release-mac-${{ matrix.arch }}/bowling
          zip -r bowling-mac-${{ matrix.arch }}.zip release-mac-${{ matrix.arch }}

      - name: Upload Mac artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: bowling-mac-${{ matrix.arch }}-zip
          path: bowling-mac-${{ matrix.arch }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML via vcpkg
        run: |
          vcpkg install sfml:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure (CMake)
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir release-windows
          copy build\Release\bowling.exe release-windows\bowling.exe
          copy build\Release\*.dll release-windows\ 2>nul || true
          if (Test-Path assets) {
            Copy-Item -Recurse assets release-windows\assets
          }
          Compress-Archive -Path release-windows\* -DestinationPath bowling-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bowling-windows
          path: bowling-windows.zip

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Mac arm64 build
        uses: actions/download-artifact@v4
        with:
          name: bowling-mac-arm64-zip
          path: artifacts/macos-arm64

      - name: Download Mac x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: bowling-mac-x86_64-zip
          path: artifacts/macos-x86_64

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: bowling-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-arm64/bowling-mac-arm64.zip
            artifacts/macos-x86_64/bowling-mac-x86_64.zip
            artifacts/windows/bowling-windows.zip
          body: |
            ## How to play

            **Mac (Apple Silicon M1/M2/M3):**
            Download `bowling-mac-arm64.zip`, unzip, then open `Play Bowling.command`.

            **Mac (Intel):**
            Download `bowling-mac-x86_64.zip`, unzip, then open `Play Bowling.command`.

            > If macOS blocks it: right-click `Play Bowling.command` -> Open.

            **Windows:**
            Download `bowling-windows.zip`, unzip, and run `bowling.exe`.
