name: Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers when you push a tag like v1.0, v1.1 etc
  workflow_dispatch:  # lets you trigger manually from GitHub's UI

jobs:
  # ────────────────────────────────────────────────────────────────
  # macOS build
  # ────────────────────────────────────────────────────────────────
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML
        run: brew install sfml

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p release-mac-${{ matrix.arch }}
          cp build/bowling release-mac-${{ matrix.arch }}/bowling-${{ matrix.arch }}
          # Copy assets if they exist
          if [ -d assets ]; then
            cp -r assets release-mac-${{ matrix.arch }}/assets
          fi
          # Use architecture-aware launcher when available.
          if [ -f play_bowling.command ]; then
            cp play_bowling.command release-mac-${{ matrix.arch }}/Play\ Bowling.command
          else
            cat > release-mac-${{ matrix.arch }}/Play\ Bowling.command << 'EOF'
            #!/bin/bash
            cd "$(dirname "$0")"
            if [ -x ./bowling-mac-arm64 ] && [ "$(uname -m)" = "arm64" ]; then
              exec ./bowling-mac-arm64
            fi
            if [ -x ./bowling-mac-x86_64 ] && [ "$(uname -m)" = "x86_64" ]; then
              exec ./bowling-mac-x86_64
            fi
            if [ -x ./bowling-arm64 ] && [ "$(uname -m)" = "arm64" ]; then
              exec ./bowling-arm64
            fi
            if [ -x ./bowling-x86_64 ] && [ "$(uname -m)" = "x86_64" ]; then
              exec ./bowling-x86_64
            fi
            echo "No compatible binary found in this folder."
            EOF
          fi
          chmod +x release-mac-${{ matrix.arch }}/Play\ Bowling.command
          chmod +x release-mac-${{ matrix.arch }}/bowling-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bowling-mac-${{ matrix.arch }}
          path: release-mac-${{ matrix.arch }}

  # ────────────────────────────────────────────────────────────────
  # Windows build
  # ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SFML via vcpkg
        run: |
          vcpkg install sfml:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure (CMake)
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir release-windows
          copy build\Release\bowling.exe release-windows\bowling.exe
          # Copy SFML DLLs
          copy build\Release\*.dll release-windows\ 2>nul || true
          # Copy assets if they exist
          if (Test-Path assets) {
            Copy-Item -Recurse assets release-windows\assets
          }
          Compress-Archive -Path release-windows\* -DestinationPath bowling-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bowling-windows
          path: bowling-windows.zip

  # ────────────────────────────────────────────────────────────────
  # Create a GitHub Release with both zips attached
  # ────────────────────────────────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Mac arm64 build
        uses: actions/download-artifact@v4
        with:
          name: bowling-mac-arm64
          path: mac-arm64

      - name: Download Mac x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: bowling-mac-x86_64
          path: mac-x86_64

      - name: Package combined Mac zip
        run: |
          mkdir -p release-mac

          # Prefer the launcher from arm64 artifact, fallback to x86_64.
          if [ -f mac-arm64/release-mac-arm64/Play\ Bowling.command ]; then
            cp mac-arm64/release-mac-arm64/Play\ Bowling.command release-mac/Play\ Bowling.command
          elif [ -f mac-x86_64/release-mac-x86_64/Play\ Bowling.command ]; then
            cp mac-x86_64/release-mac-x86_64/Play\ Bowling.command release-mac/Play\ Bowling.command
          fi

          # Include both binaries so launcher can auto-pick.
          cp mac-arm64/release-mac-arm64/bowling-arm64 release-mac/bowling-mac-arm64
          cp mac-x86_64/release-mac-x86_64/bowling-x86_64 release-mac/bowling-mac-x86_64
          chmod +x release-mac/Play\ Bowling.command
          chmod +x release-mac/bowling-mac-arm64
          chmod +x release-mac/bowling-mac-x86_64

          # Copy assets once.
          if [ -d mac-arm64/release-mac-arm64/assets ]; then
            cp -r mac-arm64/release-mac-arm64/assets release-mac/assets
          elif [ -d mac-x86_64/release-mac-x86_64/assets ]; then
            cp -r mac-x86_64/release-mac-x86_64/assets release-mac/assets
          fi

          zip -r bowling-mac.zip release-mac

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: bowling-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bowling-mac.zip
            bowling-windows.zip
          body: |
            ## How to play

            **Mac:** Download `bowling-mac.zip`, unzip it, and double-click `Play Bowling.command`.
            > If macOS blocks it: right-click → Open → Open anyway.

            **Windows:** Download `bowling-windows.zip`, unzip it, and double-click `bowling.exe`.
